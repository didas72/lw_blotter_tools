[build-system]
requires = ["hatchling >= 1.33"]
build-backend = "hatchling.build"

[project]
name = "lw_blotter_tools"
dynamic = ["version"]
description = "A Python library to handle Logic World save files."
readme = "README.md"
keywords = ["Logic World", "blotter"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Topic :: Games/Entertainment"
]
requires-python = ">= 3.8"
dependencies = [
]
authors = [{ name = "Diogo Cruz Diniz" }]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Repository = "https://github.com/didas72/lw_blotter_tools"

[project.optional-dependencies]
dev = [
    "pre-commit == 4.7.*",
]

test = [
    "pytest == 9.2.*",
]

[tool.hatch.version]
path = "src/lw_blotter_tools/__init__.py"

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflicting
    "D203",
    "D212",
    "COM812",

    # Allow TODO
    "TD002",
    "TD003",
    "FIX002",

    # Don't care
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["S101", "D", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true

[tool.pylint]
max-statements = 20
